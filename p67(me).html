<html>
    <head></head>
    <body>
        <img id="image" src="1.jpg" width="120"height="100">
          <script>
            function changeImage() {
                if (document.getElementById("image").src.includes("1.jpg")) {
                document.getElementById("image").src = "3.jpg";
            }
            else {
                document.getElementById("image").src = "1.jpg";
            }
        }
          </script>
          <input type="button" onclick="changeImage()"value="click!"/>
    </body>
</html>
